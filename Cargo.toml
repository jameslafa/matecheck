[package]
name = "matecheck"
version = "0.1.0"
edition = "2021"  # Rust edition (like Go language version)

[dependencies]
# Serialization - for loading YAML config
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling made easy
anyhow = "1.0"

# Date/Time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# Async runtime (like Go goroutines)
tokio = { version = "1", features = ["full"] }

# HTTP client for API calls
reqwest = { version = "0.11", features = ["json"] }

# Google Calendar API
google-calendar3 = "5.0"
yup-oauth2 = "10.0"
