[package]
name = "matecheck"
version = "0.1.0"
edition = "2021"  # Rust edition (like Go language version)
default-run = "matecheck"

[[bin]]
name = "matecheck"
path = "src/main.rs"

[[bin]]
name = "record_calendar_response"
path = "src/bin/record_calendar_response.rs"

[[bin]]
name = "migrate_friends"
path = "src/bin/migrate_friends.rs"

[dependencies]
# Serialization - for loading YAML config
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling made easy
anyhow = "1.0"

# Date/Time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# Async runtime (like Go goroutines)
tokio = { version = "1", features = ["full"] }

# HTTP client for API calls
reqwest = { version = "0.11", features = ["json"] }

# Google Calendar API (latest versions with hyper v1.0)
google-calendar3 = "7.0"
yup-oauth2 = { version = "12.1", features = ["hyper-rustls"] }
hyper-util = "0.1"
hyper-rustls = { version = "0.27", features = ["native-tokio", "http2", "ring"] }
rustls = { version = "0.23", features = ["ring"] }  # Crypto backend for TLS

# Async trait support (traits with async methods)
async-trait = "0.1"

# Load environment variables from .env file
dotenvy = "0.15"

# Firestore for state persistence
firestore = "0.42"
